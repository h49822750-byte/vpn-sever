# Example vpn-client configuration
server_addr: "vpn.example.com:51820"
server_public_key: "REPLACE_WITH_SERVER_ED25519_PUBLIC_KEY_BASE64"
private_key: "REPLACE_WITH_CLIENT_ED25519_PRIVATE_KEY_BASE64"
